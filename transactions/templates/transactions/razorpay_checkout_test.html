<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Razorpay Checkout Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; color: #1a1a1a; }
  label { display: block; margin-top: 12px; font-size: 13px; color: #444; }
  input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 14px; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #3399cc; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 12px; }
  .error { color: #b00020; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<h2>Razorpay Checkout — manual test</h2>
<p>Uses this backend's <code>/api/v1/razorpay/orders/</code> and <code>/verify/</code> endpoints. Needs a
real merchant API key and real Razorpay test-mode credentials configured server-side.</p>

<label>Merchant API key (Bearer token)</label>
<input id="apiKey" placeholder="sk_test_..." />

<label>Amount (INR)</label>
<input id="amount" value="499.00" />

<button id="payBtn" onclick="startPayment()">Pay with Razorpay</button>
<div id="err" class="error"></div>
<pre id="result" style="display:none"></pre>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
async function startPayment() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const amount = document.getElementById('amount').value.trim();
  const errEl = document.getElementById('err');
  const resultEl = document.getElementById('result');
  errEl.textContent = '';
  resultEl.style.display = 'none';

  if (!apiKey) { errEl.textContent = 'Enter a merchant API key first.'; return; }

  try {
    const orderRes = await fetch('/api/v1/razorpay/orders/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + apiKey },
      body: JSON.stringify({ amount, currency: 'INR' }),
    });
    const order = await orderRes.json();
    if (!orderRes.ok) throw new Error(JSON.stringify(order));

    if (order.status === 'requires_review') {
      errEl.textContent = 'Flagged for manual review — not sent to Razorpay.';
      return;
    }

    const rzp = new Razorpay({
      key: order.razorpay_key_id,
      amount: order.amount,
      currency: order.currency,
      order_id: order.razorpay_order_id,
      name: 'Test Checkout',
      handler: async function (response) {
        const verifyRes = await fetch(`/api/v1/razorpay/orders/${order.transaction_id}/verify/`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + apiKey },
          body: JSON.stringify({
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_signature: response.razorpay_signature,
          }),
        });
        const verified = await verifyRes.json();
        resultEl.style.display = 'block';
        resultEl.textContent = JSON.stringify(verified, null, 2);
      },
      modal: {
        ondismiss: function () { errEl.textContent = 'Checkout closed before completing payment.'; },
      },
    });
    rzp.on('payment.failed', function (response) {
      errEl.textContent = 'Payment failed: ' + response.error.description;
    });
    rzp.open();
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
