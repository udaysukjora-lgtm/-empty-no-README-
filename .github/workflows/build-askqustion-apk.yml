name: Build AskQustion APK

on:
  push:
    branches:
      - claude/android-app-website-hztps4
    paths:
      - "askqustion-app/**"
      - ".github/workflows/build-askqustion-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: askqustion-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: askqustion-debug-apk
          path: askqustion-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
